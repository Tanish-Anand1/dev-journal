name: Daily Dev Log Automation

on:
  schedule:
    # Runs at 18:00 UTC (11:30 PM IST) every day
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_journal.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Tanish-Anand1"
          git config --global user.email "tanishanand.official@gmail.com"
          git add logs/
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-generate daily log entry for $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new logs to commit."
          fi
